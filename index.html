<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>JShell — Java 17 in the Browser</title>
    <script src="https://cjrtnc.leaningtech.com/4.2/loader.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; background: #0a0a1a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Header */
        .header { background: #12122a; border-bottom: 1px solid #2a2a4a; padding: 8px 16px; display: flex; align-items: center; gap: 10px; font-size: 13px; flex-shrink: 0; }
        .header h1 { font-size: 14px; color: #7ec8e3; font-weight: 600; }
        .header .sep { color: #2a2a4a; }
        .header .version { color: #556; font-size: 11px; }
        .header .spacer { flex: 1; }
        .header .status { color: #556; font-size: 12px; }
        .header .status.ready { color: #4ecca3; }
        .header button { background: #2a2a4a; color: #999; border: 1px solid #3a3a5a; padding: 3px 10px; border-radius: 3px; font-size: 11px; cursor: pointer; font-family: inherit; }
        .header button:hover { background: #3a3a5a; color: #fff; }

        /* Console output */
        .console { flex: 1; overflow-y: auto; padding: 12px 16px; font-size: 14px; line-height: 1.6; }
        .console .entry { margin-bottom: 2px; white-space: pre-wrap; }
        .console .prompt { color: #7ec8e3; }
        .console .input-text { color: #e0e0e0; white-space: pre-wrap; }
        .console .output { color: #4ecca3; white-space: pre-wrap; }
        .console .error { color: #ff6b6b; white-space: pre-wrap; }
        .console .info { color: #556; font-size: 12px; white-space: pre-wrap; }
        .console .exception { color: #ffa07a; white-space: pre-wrap; }

        /* Input row */
        .input-row { display: flex; align-items: flex-start; padding: 8px 16px 12px; background: #12122a; border-top: 1px solid #2a2a4a; flex-shrink: 0; }
        .input-row .prompt { color: #7ec8e3; padding: 6px 0; margin-right: 8px; flex-shrink: 0; user-select: none; }
        .input-row textarea { flex: 1; background: transparent; color: #e0e0e0; border: none; outline: none; font-family: inherit; font-size: 14px; resize: none; line-height: 1.6; padding: 6px 0; height: 28px; overflow: hidden; }
        .run-btn { background: none; border: 1px solid #3a3a5a; color: #4ecca3; padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 14px; flex-shrink: 0; margin-left: 6px; font-family: inherit; align-self: center; }
        .run-btn:hover { background: #1a3a2a; }
        .run-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Loading */
        .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 16px; }
        .loading h2 { color: #7ec8e3; font-weight: 400; font-size: 18px; }
        .loading p { color: #556; font-size: 13px; }
        .loading.hidden { display: none; }
        @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
        .loading .dots span { animation: pulse 1.4s infinite; }
        .loading .dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading .dots span:nth-child(3) { animation-delay: 0.4s; }

        /* CheerpJ stdout capture — hidden */
        #console { position: absolute; left: -9999px; top: -9999px; }

        /* Mobile */
        @media (max-width: 600px) {
            .header { padding: 6px 10px; gap: 6px; }
            .header .version, .header .hint { display: none; }
            .console { padding: 8px 10px; font-size: 13px; }
            .input-row { padding: 6px 10px 8px; }
            .input-row textarea { font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>jshell</h1>
        <span class="sep">|</span>
        <span class="version">Java 17</span>
        <span class="spacer"></span>
        <button onclick="handleCommand('/clear')">Clear</button>
        <button onclick="handleCommand('/reset')">Reset</button>
        <span class="status" id="status">loading...</span>
    </div>

    <div class="loading" id="loading">
        <h2>JShell</h2>
        <p id="loading-status">Initializing<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
    </div>

    <div class="console" id="output" style="display:none"></div>

    <div class="input-row" id="input-row" style="display:none">
        <span class="prompt">jshell&gt;</span>
        <textarea id="input" rows="1" autofocus placeholder="Type Java code..." disabled></textarea>
        <button class="run-btn" id="runBtn" onclick="evalInput()" disabled title="Run (Enter)">&#9654;</button>
    </div>

    <!-- CheerpJ routes System.out here -->
    <pre id="console"></pre>

    <script>
        const outputEl = document.getElementById('output');
        const inputEl = document.getElementById('input');
        const statusEl = document.getElementById('status');
        const loadingEl = document.getElementById('loading');
        const loadingStatus = document.getElementById('loading-status');
        const consoleEl = document.getElementById('console');
        const inputRow = document.getElementById('input-row');

        let jshellBridge = null;
        let evalBusy = false;
        let history = [];
        let historyIdx = -1;

        // ============================================================
        // CheerpJ console capture
        // ============================================================
        let consoleSnapshot = '';
        function flushConsole() {
            const text = consoleEl.textContent;
            const newText = text.slice(consoleSnapshot.length);
            consoleSnapshot = text;
            return newText;
        }
        function clearCheerpjConsole() {
            consoleEl.textContent = '';
            consoleSnapshot = '';
        }

        // Wait for CheerpJ to flush stdout to #console DOM (or timeout)
        function waitForConsole(timeoutMs = 150) {
            return new Promise(resolve => {
                // If there's already new content, resolve immediately
                if (consoleEl.textContent.length > consoleSnapshot.length) {
                    resolve();
                    return;
                }
                let resolved = false;
                const done = () => { if (!resolved) { resolved = true; observer.disconnect(); resolve(); } };
                const observer = new MutationObserver(done);
                observer.observe(consoleEl, { childList: true, characterData: true, subtree: true });
                setTimeout(done, timeoutMs); // fallback if no output
            });
        }

        // ============================================================
        // Display helpers
        // ============================================================
        let userScrolledUp = false;
        outputEl?.addEventListener('scroll', () => {
            const gap = outputEl.scrollHeight - outputEl.scrollTop - outputEl.clientHeight;
            userScrolledUp = gap > 60;
        });

        function appendToOutput(html) {
            outputEl.insertAdjacentHTML('beforeend', html);
            if (!userScrolledUp) outputEl.scrollTop = outputEl.scrollHeight;
        }

        function showInput(code) {
            const lines = esc(code).split('\n');
            const html = lines.map((line, i) =>
                `<span class="prompt">${i === 0 ? 'jshell&gt;' : '   ...'}</span> <span class="input-text">${line}</span>`
            ).join('\n');
            appendToOutput(`<div class="entry">${html}</div>`);
        }

        function showOutput(text) {
            if (!text) return;
            // Separate exception lines for distinct styling. Match real
            // jshell prefix: "|  Exception ...".
            const lines = text.split('\n');
            const html = lines.map(line => {
                if (line.startsWith('|  Exception ') || line.startsWith('|        at ')) {
                    return `<span class="exception">${esc(line)}</span>`;
                }
                return `<span class="output">${esc(line)}</span>`;
            }).join('\n');
            appendToOutput(`<div class="entry">${html}</div>`);
        }

        function showError(text) {
            if (text) appendToOutput(`<div class="entry"><span class="error">${esc(text)}</span></div>`);
        }

        function showInfo(text) {
            appendToOutput(`<div class="entry"><span class="info">${esc(text)}</span></div>`);
        }

        function esc(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // Auto-focus input when user starts typing (not on click — allows text selection)
        document.addEventListener('keydown', (e) => {
            if (document.activeElement === inputEl) return;
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            if (e.key.length === 1 || e.key === 'Backspace' || e.key === 'Delete') {
                inputEl.focus();
            }
        });

        // ============================================================
        // Engine
        // ============================================================
        async function loadPrecompiled(className) {
            const resp = await fetch(`precompiled/${className}.class`);
            if (!resp.ok) throw new Error(`Failed to load ${className}.class`);
            cheerpOSAddStringFile(`/str/${className}.class`, new Uint8Array(await resp.arrayBuffer()));
        }

        async function initEngine() {
            loadingStatus.innerHTML = 'Initializing CheerpJ<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
            await cheerpjInit({ status: 'none', version: 17 });

            loadingStatus.innerHTML = 'Loading JShell<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
            await loadPrecompiled('JShellBridge');
            await loadPrecompiled('JShellBridge$SwitchOutputStream');

            loadingStatus.innerHTML = 'Starting JShell<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
            const jar = (name) => '/app' + new URL(name, location.href).pathname;
            const lib = await cheerpjRunLibrary(
                jar('jdk.jshell.jar') + ':' + jar('jdk.compiler_17.jar') + ':/str/');
            jshellBridge = await lib.JShellBridge;

            const initResult = await jshellBridge.init();
            const initStr = initResult != null ? await initResult.toString() : '';
            if (!initStr.includes('OK')) throw new Error('JShell init: ' + initStr);

            loadingStatus.innerHTML = 'Warming up compiler<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
            clearCheerpjConsole();
            await jshellBridge.eval('1+1');
            flushConsole();
            await jshellBridge.reset(); // start fresh — warmup created $1
            clearCheerpjConsole();

            // Ready
            loadingEl.classList.add('hidden');
            outputEl.style.display = '';
            inputRow.style.display = '';
            inputEl.disabled = false;
            document.getElementById('runBtn').disabled = false;
            statusEl.textContent = 'ready';
            statusEl.classList.add('ready');

            showInfo('JShell (Java 17) running in the browser via CheerpJ');
            showInfo('Type Java code and press Enter. /help for commands.\n');
            inputEl.focus();
        }

        // ============================================================
        // Commands
        // ============================================================
        // Dev mode: gates the testing/diagnostic commands behind a toggle
        // and persists across reloads via localStorage. Designed to grow
        // (future settings: soft-reset threshold, log level, …) — keep new
        // fields here and they'll round-trip through save/load.
        const DEV_KEY = 'jshell_dev_settings';
        const devSettings = { enabled: false };
        try {
            const stored = localStorage.getItem(DEV_KEY);
            if (stored) Object.assign(devSettings, JSON.parse(stored));
        } catch (e) { /* ignore */ }
        function saveDevSettings() {
            try { localStorage.setItem(DEV_KEY, JSON.stringify(devSettings)); }
            catch (e) { /* ignore */ }
        }

        const USER_HELP = `/help     — show this help
/clear    — clear the console
/reset    — reset JShell session (clear all state)
/dev      — enable developer mode

Type Java code and press Enter.

Shortcuts:
  Enter        — run code
  Shift+Enter  — new line
  Up/Down      — command history`;

        const DEV_HELP = `/help     — show this help
/clear    — clear the console
/reset    — reset JShell session (clear all state)
/dev      — toggle developer mode (currently ON)
/test           — run all 5 test suites
/test-language  — Java language features
/test-format    — value display format
/test-scratch   — $N scratch-variable semantics
/test-errors    — compile errors, runtime exceptions, single-execution
/test-advanced  — multiline + integration programs
/probe          — diagnostic snapshot (varValue, event status, reset budget)
/diag <code>    — show JShell internals for given code

Shortcuts:
  Enter        — run code
  Shift+Enter  — new line
  Up/Down      — command history`;

        function handleCommand(cmd) {
            if (cmd === '/help') {
                showInfo(devSettings.enabled ? DEV_HELP : USER_HELP);
            } else if (cmd === '/clear') {
                outputEl.innerHTML = '';
            } else if (cmd === '/reset') {
                resetSession();
            } else if (cmd === '/test' && devSettings.enabled) {
                runAllTests();
            } else if (cmd === '/dev' || cmd === '/dev on' || cmd === '/dev off') {
                const wasOn = devSettings.enabled;
                if (cmd === '/dev on') devSettings.enabled = true;
                else if (cmd === '/dev off') devSettings.enabled = false;
                else devSettings.enabled = !devSettings.enabled;
                saveDevSettings();
                showInfo('Developer mode: ' + (devSettings.enabled ? 'ON' : 'OFF'));
                // When transitioning OFF → ON, show the full command list so
                // the user immediately sees what's now available.
                if (devSettings.enabled && !wasOn) {
                    showInfo('');
                    showInfo(DEV_HELP);
                }
            } else {
                // Match real jshell's invalid-command format
                showError('|  Invalid command: ' + cmd);
                showError('|  Type /help for help.');
            }
        }

        async function resetSession() {
            let resultStr = '';
            if (jshellBridge) {
                const r = await jshellBridge.reset();
                resultStr = r != null ? await r.toString() : '';
            }
            outputEl.innerHTML = '';
            // Detect the @@RELOAD@@ signal from the bridge — the hybrid-reset
            // logic emits it when the hard-reset budget is at the limit.
            if (resultStr.startsWith('@@RELOAD@@')) {
                showError('⚠️  ' + resultStr.replace('@@RELOAD@@:', ''));
                showError('Please hard-reload the page (Ctrl+Shift+R) for a clean state.');
            } else {
                showInfo('Session reset — all state cleared');
                if (resultStr.includes('hard reset')) showInfo(resultStr);
            }
            statusEl.textContent = 'ready';
            statusEl.classList.add('ready');
        }

        // ============================================================
        // Eval
        // ============================================================
        async function evalInput() {
            const code = inputEl.value.trimEnd();
            if (!code.trim()) return;
            if (evalBusy) return;
            evalBusy = true;

            history.push(code);
            historyIdx = history.length;
            showInput(code);
            inputEl.value = '';
            autoResize();

            // Handle commands
            const trimmed = code.trim();
            if (trimmed.startsWith('/')) {
                // Gate dev-only commands behind devSettings.enabled. When off,
                // typing /test or /probe falls through to handleCommand which
                // shows "Invalid command" — same as any unknown slash command.
                const isDevCmd = trimmed === '/test'
                    || trimmed.startsWith('/test-')
                    || trimmed === '/probe'
                    || trimmed.startsWith('/diag ');
                if (isDevCmd && !devSettings.enabled) {
                    showError('|  Invalid command: ' + trimmed);
                    showError('|  Type /help for help.');
                    evalBusy = false;
                    statusEl.textContent = 'ready';
                    statusEl.classList.add('ready');
                    inputEl.focus();
                    return;
                }
                if (trimmed === '/test')          { evalBusy = false; runAllTests(); return; }
                if (trimmed === '/test-language') { evalBusy = false; runSingleSuite('language', runTestLanguage); return; }
                if (trimmed === '/test-format')   { evalBusy = false; runSingleSuite('format',   runTestFormat);   return; }
                if (trimmed === '/test-scratch')  { evalBusy = false; runSingleSuite('scratch',  runTestScratch);  return; }
                if (trimmed === '/test-errors')   { evalBusy = false; runSingleSuite('errors',   runTestErrors);   return; }
                if (trimmed === '/test-advanced') { evalBusy = false; runSingleSuite('advanced', runTestAdvanced); return; }
                if (trimmed === '/probe') {
                    try {
                        const out = await jshellBridge.probe();
                        const str = out != null ? await out.toString() : '';
                        showInfo(str || '(empty output)');
                    } catch (e) {
                        showError('/probe threw: ' + (e && e.stack ? e.stack : e));
                    }
                } else if (trimmed.startsWith('/diag ')) {
                    await evalCode(trimmed, true);
                } else {
                    handleCommand(trimmed);
                }
                evalBusy = false;
                statusEl.textContent = 'ready';
                statusEl.classList.add('ready');
                inputEl.focus();
                return;
            }

            await evalCode(code, false);
            evalBusy = false;
            inputEl.focus();
        }

        async function evalCode(code, isDiag) {
            statusEl.textContent = 'running...';
            statusEl.classList.remove('ready');

            const t0 = performance.now();
            try {
                clearCheerpjConsole();
                const jResult = isDiag
                    ? await jshellBridge.diagnose(code.replace(/^\/diag\s+/, ''))
                    : await jshellBridge.eval(code);
                const javaResult = jResult != null ? await jResult.toString() : '';
                // Always wait for CheerpJ to flush stdout to #console DOM.
                // CheerpJ routes System.out asynchronously — output may arrive
                // after the Java eval() call returns, especially on first execution.
                await waitForConsole();
                const consoleOutput = flushConsole().trim();

                const combined = [javaResult.trim(), consoleOutput].filter(Boolean).join('\n');

                if (combined.includes('@@ERR@@')) {
                    // Split: error lines (@@ERR@@ prefix) in red, output lines in green
                    const lines = combined.split('\n');
                    const errLines = lines.filter(l => l.startsWith('@@ERR@@')).map(l => l.slice(7));
                    const outLines = lines.filter(l => !l.startsWith('@@ERR@@') && l.trim());
                    if (outLines.length) showOutput(outLines.join('\n'));
                    if (errLines.length) showError(errLines.join('\n'));
                } else if (combined) {
                    showOutput(combined);
                }
            } catch (e) {
                try {
                    if (e && e.message) showError('Error: ' + e.message);
                    else if (e && typeof e.getMessage === 'function') {
                        const msg = await e.getMessage();
                        showError('Error: ' + (msg ? await msg.toString() : 'unknown'));
                    } else showError('Error (see browser console)');
                } catch (_) {
                    showError('Error (see browser console)');
                }
            }

            const ms = Math.round(performance.now() - t0);
            statusEl.textContent = `ready (${ms}ms)`;
            statusEl.classList.add('ready');
        }

        // ============================================================
        // Input handling
        // ============================================================
        function autoResize() {
            inputEl.style.height = '28px';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
        }

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                evalInput();
            }
            if (e.key === 'ArrowUp') {
                if (historyIdx <= 0 && history.length > 0) {
                    historyIdx = history.length;
                }
                if (historyIdx > 0) {
                    historyIdx--;
                    inputEl.value = history[historyIdx];
                    autoResize();
                }
                e.preventDefault();
            }
            if (e.key === 'ArrowDown') {
                if (historyIdx < history.length - 1) {
                    historyIdx++;
                    inputEl.value = history[historyIdx];
                } else {
                    historyIdx = history.length;
                    inputEl.value = '';
                }
                autoResize();
                e.preventDefault();
            }
        });

        inputEl.addEventListener('input', autoResize);

        // ============================================================
        // Test suites — reorganized into 5 focused groups:
        //   /test           — run all 5 in sequence
        //   /test-language  — Java language features
        //   /test-format    — exact value-formatting per type
        //   /test-scratch   — $N scratch-variable semantics
        //   /test-errors    — compile errors, runtime exceptions, single-execution
        //   /test-advanced  — multiline parsing + integration programs
        // Shared state (__pass/__fail/__n) is reset per suite run.
        // ============================================================
        async function runEval(code) {
            clearCheerpjConsole();
            const jResult = await jshellBridge.eval(code);
            const javaResult = jResult != null ? await jResult.toString() : '';
            await new Promise(r => setTimeout(r, 250));
            const consoleOutput = flushConsole().trim();
            let out = [javaResult.trim(), consoleOutput].filter(Boolean).join('\n').trim();
            // Strip javac's "An exception has occurred in the compiler..." banner
            // + its 30-line stack trace. These are compiler-internal diagnostics
            // (CheerpJ's javac has a known NPE after many compiles); the real
            // error already appears above. Collapse consecutive duplicate
            // markers so multi-snippet inputs don't stack 5 identical lines.
            out = out.replace(
                /An exception has occurred in the compiler[\s\S]*?at com\.leaningtech\.cheerpj\.CheerpJLibrary\.run\(Unknown Source\)/g,
                '[javac internal error elided]'
            );
            out = out.replace(/(\[javac internal error elided\]\s*){2,}/g, '[javac internal error elided]\n');
            return out.trim();
        }

        let __pass = 0, __fail = 0, __n = 0;
        function $(val) { return '$' + (++__n) + ' ==> ' + val; }
        function skip() { __n++; }
        //
        // 'exact' is the default mode. Use 'contains' only when the
        // expected output legitimately includes nondeterministic data:
        //
        //   - Object hashes — e.g. `Foo@1a2b3c`, `$Lambda/0x.../0x...@hash`
        //   - Exception stack traces — `at (#N:L)` snippet IDs vary, and we
        //     don't emit the `at (...)` line at all (we have only the first
        //     `|  Exception java.lang.X: msg` line; jshell adds frames below)
        //   - javac compile diagnostics — column positions and caret pointers
        //     vary by source layout; we use `@@ERR@@` as our prefix
        //
        // For everything else, exact match is preferred so format drift gets
        // caught the moment it appears. We have verified the exact format
        // against real `jshell` 25 (input output line-for-line) for every
        // /test-format and /test-scratch test that uses exact mode.
        //
        async function test(input, expected, label, mode = 'exact') {
            const actual = await runEval(input);
            let ok;
            if (expected === null) ok = true;
            else if (mode === 'contains') ok = actual.includes(expected);
            else ok = actual === expected;
            if (ok) __pass++; else __fail++;
            const icon = ok ? '\u2705' : '\u274C';
            if (ok) { showOutput(`${icon} ${label}`); return; }
            // Tight truncation so a failed suite can't drown the log.
            let shown = actual;
            const lines = shown.split('\n');
            if (lines.length > 3) shown = lines.slice(0, 3).join('\n') + `  [+${lines.length - 3} more lines]`;
            if (shown.length > 200) shown = shown.slice(0, 200) + `…  [+${shown.length - 200} more chars]`;
            showError(`${icon} ${label}\n   expected: ${expected}\n   actual:   ${shown}`);
        }

        // ------------------------------------------------------------
        // Suite: language features
        // ------------------------------------------------------------
        async function runTestLanguage() {
            await jshellBridge.reset(); __n = 0;

            showInfo('--- Variables ---');
            skip(); await test('int x = 10', 'x ==> 10', 'var declaration');
            await test('x', (__n++, 'x ==> 10'), 'bare var read');
            await test('x + 5', $(15), 'var in expression');
            skip(); await test('int x = 99', 'x ==> 99', 'var redefinition');
            await test('x', (__n++, 'x ==> 99'), 'var after redefinition');
            skip(); await test('var y = "auto"', 'y ==> "auto"', 'var type inference');
            await test('y', (__n++, 'y ==> "auto"'), 'inferred var read');

            showInfo('\n--- Variable type replacement ---');
            skip(); await test('int xx = 45', 'xx ==> 45', 'int var');
            skip(); await test('String xx = "hello"', 'xx ==> "hello"', 'replace int with String');
            await test('xx', (__n++, 'xx ==> "hello"'), 'read replaced var');
            await test('xx.length()', $(5), 'method on replaced type');

            showInfo('\n--- Methods ---');
            skip(); await test('int square(int n) { return n * n; }', '|  created method square(int)', 'method def');
            await test('square(7)', $(49), 'method call');
            skip(); await test('int add(int a, int b) { return a + b; }', '|  created method add(int,int)', 'multi-arg method');
            await test('add(3, 4)', $(7), 'multi-arg call');

            showInfo('\n--- Overloading ---');
            skip(); await test('String fmt(int n) { return "int:" + n; }', '|  created method fmt(int)', 'overload 1');
            skip(); await test('String fmt(String s) { return "str:" + s; }', '|  created method fmt(String)', 'overload 2');
            await test('fmt(42)', $('"int:42"'), 'dispatch int');
            await test('fmt("hi")', $('"str:hi"'), 'dispatch String');

            showInfo('\n--- Varargs ---');
            skip(); await test('int sum(int... nums) { int t = 0; for (int n : nums) t += n; return t; }',
                '|  created method sum(int...)', 'varargs');
            await test('sum(1, 2, 3, 4, 5)', $(15), 'varargs call');

            showInfo('\n--- Classes ---');

            await test([
                'var results = new ArrayList<String>();',
                'results.add("fib10=" + fib(10));',
                'results.add("builder=" + new Builder().add("OK").build());',
                'results.add("earth_g=" + String.format("%.0f", Planet.EARTH.gravity() * 10));',
                'results.add("eval=" + evaluate(new Add(new Num(1), new Num(2))));',
                'String.join(", ", results)'
            ].join('\n'), 'fib10=55, builder=OK, earth_g=98, eval=3', 'cross-reference all', 'contains');
        }

        // ------------------------------------------------------------
        // Dispatcher — single-suite runner and all-in-one runner
        // ------------------------------------------------------------
        async function runSingleSuite(name, fn) {
            outputEl.innerHTML = '';
            await jshellBridge.reset();
            __pass = 0; __fail = 0;
            showInfo(`Running /test-${name}...\n`);
            await fn();
            showInfo(`\n${__pass} passed, ${__fail} failed out of ${__pass + __fail} tests`);
        }

        async function runAllTests() {
            outputEl.innerHTML = '';
            // NOTE on limitations: CheerpJ's javac accumulates unresettable state
            // across JShell instances (proved via /probe-reset — the WASM JVM
            // leaks below shell.close()). After ~15 resets it starts emitting
            // NullPointerExceptions from Names.Table and everything after is
            // broken until the PAGE IS RELOADED.
            //
            // We minimize resets here: each suite already resets at its own
            // start, so we don't reset again between suites. Order: heaviest
            // first, so lighter suites land later where corruption is more
            // likely. If /test fails mid-way, hard-reload (Ctrl+Shift+R) and
            // run the affected /test-<suite> individually.
            showInfo('Running full test suite...\n');
            const suites = [
                ['advanced', runTestAdvanced],
                ['errors',   runTestErrors],
                ['scratch',  runTestScratch],
                ['format',   runTestFormat],
                ['language', runTestLanguage],
            ];
            let totalP = 0, totalF = 0;
            for (const [name, fn] of suites) {
                __pass = 0; __fail = 0;
                showInfo(`\n========== /test-${name} ==========\n`);
                await fn();
                showInfo(`\n— ${name}: ${__pass} passed, ${__fail} failed —`);
                totalP += __pass;
                totalF += __fail;
            }
            showInfo(`\n======================================`);
            showInfo(`TOTAL: ${totalP} passed, ${totalF} failed out of ${totalP + totalF}`);
            // Show the actual hard-reset budget state — concrete data instead
            // of a generic suggestion. Memory accumulates because compiled
            // classes pile up in the classloader; the hybrid reset upgrades
            // to a real close+build every 20 evals to flush them, but CheerpJ
            // limits us to 14 such cycles per page.
            try {
                const state = await jshellBridge.getHardResetState();
                const stateStr = state != null ? await state.toString() : '?/?';
                const [used, max] = stateStr.split('/').map(Number);
                const remaining = (max - used);
                if (remaining <= 2) {
                    showError(`\n⚠️  ${stateStr} hard resets used. Only ${remaining} left before CheerpJ's class-cliff — reload the page (F5) before running tests again.`);
                } else {
                    showInfo(`\n💡  ${stateStr} hard resets used (${remaining} budget left). Reload the page (F5) for a clean slate before running /test again.`);
                }
            } catch (e) {
                showInfo(`\n💡  Reload the page (F5) for a clean slate before running /test again.`);
            }
        }

        // ============================================================
        // Init
        // ============================================================
        initEngine().catch(e => {
            loadingStatus.textContent = 'Failed: ' + (e.message || e);
        });
    </script>
</body>
</html>
